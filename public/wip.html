<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Work in Progress | Bennit</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #0a0a0f;
      color: #f3f4f6;
      font-family: 'Inter', sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      text-align: center;
    }
    .container {
      max-width: 400px;
      padding: 2.5rem 2rem;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 1.5rem;
      box-shadow: 0 20px 40px -10px rgba(0,0,0,0.5);
      backdrop-filter: blur(10px);
    }
    h1 {
      font-size: 2rem;
      margin: 0 0 0.75rem 0;
      font-weight: 800;
      background: linear-gradient(to right, #06b6d4, #8b5cf6);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    p {
      color: #9ca3af;
      margin: 0 0 2rem 0;
      line-height: 1.6;
    }
    a {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.75rem 1.5rem;
      background: #1f2937;
      color: #fff;
      text-decoration: none;
      border-radius: 0.75rem;
      font-weight: 600;
      transition: all 0.2s;
      border: 1px solid rgba(255,255,255,0.1);
    }
    a:hover {
      background: #374151;
      transform: translateY(-2px);
    }
  </style>
</head>
<body>
  <!-- Decorative background glows -->
  <div style="position: absolute; top: 30%; left: 30%; width: 300px; height: 300px; background: rgba(6,182,212,0.1); border-radius: 50%; filter: blur(100px); pointer-events: none; transform: translate(-50%, -50%);"></div>
  <div style="position: absolute; top: 60%; left: 70%; width: 300px; height: 300px; background: rgba(139,92,246,0.1); border-radius: 50%; filter: blur(100px); pointer-events: none; transform: translate(-50%, -50%);"></div>

  <div class="container">
    <svg style="width: 56px; height: 56px; margin: 0 auto 1.5rem; color: #8b5cf6;" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M10 20l4-16m4 4l4 4-4 4M6 16l-4-4 4-4"></path>
    </svg>
    <h1>Coming Soon</h1>
    <p>A detailed mockup and case study for this project is currently in the works. Check back later!</p>
    <a href="/MyWebsite/">
      <svg style="width: 18px; height: 18px;" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path></svg>
      Return to Portfolio
    </a>
  </div>
</body>
</html>
